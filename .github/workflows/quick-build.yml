name: Quick Build (Development)

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  quick-build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache Theos
        uses: actions/cache@v3
        with:
          path: ~/theos
          key: theos-${{ runner.os }}-${{ hashFiles('.github/workflows/quick-build.yml') }}
          restore-keys: |
            theos-${{ runner.os }}-

      - name: Install Theos (if not cached)
        run: |
          if [ ! -d ~/theos ]; then
            git clone --depth=1 https://github.com/theos/theos.git ~/theos
            cd ~/theos
            git submodule update --init --recursive --depth=1
          fi

      - name: Setup environment
        run: |
          echo "THEOS=~/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Quick build
        run: |
          export THEOS=~/theos
          make clean
          time make FINALPACKAGE=1

      - name: Summary
        if: always()
        run: |
          echo "=== Build Summary ==="
          if [ -d ".theos/obj" ]; then
            find .theos/obj -name "*.dylib" | while read f; do
              echo "✓ $(basename $f)"
              du -h "$f"
            done
          else
            echo "✗ No build artifacts found"
            exit 1
          fi
